<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Witness">
  <title>Witness</title>
  <!-- A block of text with a rubricated point at the end: the mark a scribe left
       to say "this is accounted for". The name changed; the idea did not. -->
  <rect width="64" height="64" rx="12" fill="#1c1917"/>
  <g fill="none" stroke="#f2ece3" stroke-width="3.2" stroke-linecap="round">
    <path d="M14 21h36"/>
    <path d="M14 31h26"/>
    <path d="M14 41h15"/>
  </g>
  <circle cx="45" cy="41" r="4.6" fill="#c0442f"/>
</svg>
